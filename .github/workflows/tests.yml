name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Build optional macOS menu bar app
        if: runner.os == 'macOS' && matrix.python == '3.12'
        run: python build_menubar.py --output "$RUNNER_TEMP/Codex Auto Effort.app"
